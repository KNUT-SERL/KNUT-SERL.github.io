<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — SER Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>

<section class="pagehead">
  <div class="wrap">
    <h1>Gallery</h1>
    <p>Moments from the lab.</p>
  </div>
</section>

<section class="sec" style="padding-top:28px">
  <div class="wrap">
    <div class="gal" id="gal-grid"></div>
    <p id="gal-empty" style="display:none;color:var(--sub)">Photos coming soon.</p>
  </div>
</section>

<script src="site-data.js?v=3"></script>
<script src="common.js?v=3"></script>
<script>
"use strict";
// 사진을 GitHub 저장소에 올리고 site-data.js 의 SITE.gallery 에 한 줄 추가하세요.
const g = window.SITE.gallery;
if (g.length) {
  document.getElementById("gal-grid").innerHTML = g.map(x => `
    <figure>
      <img src="${x.src}" alt="${x.caption || ""}" loading="lazy" onerror="this.closest('figure').remove()">
      ${x.caption ? `<figcaption>${x.caption}</figcaption>` : ""}
    </figure>`).join("");
} else {
  document.getElementById("gal-empty").style.display = "block";
}
</script>
</body>
</html>
