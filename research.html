<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research — SER Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>

<section class="pagehead">
  <div class="wrap">
    <h1>Research</h1>
    <p>What we build, and why it matters.</p>
  </div>
</section>

<section class="sec">
  <div class="wrap">
    <div class="grid c2" id="research-list"></div>
  </div>
</section>

<script src="site-data.js?v=6"></script>
<script src="common.js?v=6"></script>
<script>
"use strict";
// 연구 분야 카드 — 대표 이미지(원본 그대로) + 설명. 내용은 site-data.js 의 SITE.research 에서 수정
document.getElementById("research-list").innerHTML = window.SITE.research.map(r => `
  <div class="card">
    <img class="fig" src="${r.img}" alt="${r.title}"
         onerror="this.remove()" loading="lazy">
    <p>${r.desc}</p>
  </div>`).join("");
</script>
</body>
</html>
