<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research — SER Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=14">
</head>
<body>

<section class="pagehead">
  <div class="wrap">
    <h1>Research</h1>
    <p>What we build, and why it matters.</p>
  </div>
</section>

<section class="sec">
  <div class="wrap" id="research-list"></div>
</section>

<script src="data/site-data.js?v=14"></script>
<script src="js/content.js?v=14"></script>
<script src="js/common.js?v=14"></script>
<script>
"use strict";
/* 연구 분야 = research/ 폴더의 파일들.
   'R-001-SoftRobotElectronics.jpg' + 같은 이름 .txt(제목·요약)를 올리면
   순번 순서대로 아래에 한 줄씩 나타납니다 (README.md 참고). */
document.addEventListener("DOMContentLoaded", async () => {
  const el = document.getElementById("research-list");
  const list = await loadResearch();
  el.innerHTML = list.length ? list.map(r => `
    <div class="rrow">
      ${r.image ? `<img src="${encodeURI(r.image)}" alt="${r.title}" loading="lazy"
                        onerror="this.remove()">` : ""}
      <div>
        <h3>${r.title}</h3>
        <p>${r.desc}</p>
      </div>
    </div>`).join("")
  : '<p style="color:var(--sub)">Research topics coming soon.</p>';
});
</script>
</body>
</html>
