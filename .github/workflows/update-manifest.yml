# ============================================================================
# 콘텐츠 목록 자동 갱신
#
# members/ 나 gallery/ 에 파일이 올라오면 자동으로 실행되어:
#   1) 사진이 없는 구성원에게 파스텔 자리표시 이미지를 만들어 주고
#   2) 사이트가 읽는 목록(data/manifest.json)을 다시 만들어 커밋합니다
#
# 관리자가 손댈 일은 없습니다. 실행 기록은 저장소의 Actions 탭에서 볼 수 있고,
# 실패하면 그 탭에 빨간 X 로 표시됩니다 (README.md 문제 해결 항목 참고).
# ============================================================================
name: update-manifest

on:
  push:
    branches: [main]
    paths:
      - "members/**"
      - "gallery/**"
      - "research/**"
      - "images/professor.*"
      - "tools/**"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행도 가능

permissions:
  contents: write

concurrency:
  group: update-manifest
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 연달아 올려도 항상 최신 상태에서 실행

      - name: 자리표시 이미지·목록 생성
        run: |
          node tools/make-placeholders.mjs
          node tools/make-manifest.mjs

      - name: 변경 사항 커밋
        id: commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "자동: 구성원·갤러리 목록 갱신 (manifest)"
            git pull --rebase origin main || true
            git push
            echo "changed=1" >> "$GITHUB_OUTPUT"
          else
            echo "변경 없음 — 커밋 생략"
          fi

      # 봇 커밋은 Pages 자동 배포를 건너뛸 수 있어 배포를 직접 요청합니다.
      # 실패해도 치명적이지 않음: 다음 업로드 때 함께 반영됩니다.
      - name: Pages 재배포 요청
        if: steps.commit.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "(요청 실패 — 다음 커밋 때 반영됨)"
