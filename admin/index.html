<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>SER Lab 관리자</title>
<!-- 관리자 화면: 사이트 주소 뒤에 /admin/ 을 붙여 엽니다. GitHub 토큰을 한 번 넣으면
     구성원·갤러리·연구 분야·뉴스·특허·상장·이미지를 화면에서 바로 고칠 수 있습니다 (README 14장).
     Edge/Chrome 주소창의 "앱 설치" 를 누르면 윈도우 프로그램처럼 창으로 실행됩니다. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1a2b">
<link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../images/favicon-192.png">
<link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
<link rel="stylesheet" href="admin.css?a=1">
</head>
<body>

<aside class="side">
  <div class="brand"><img src="../images/favicon-192.png" alt=""><div><b>SER Lab</b><span>사이트 관리자</span></div></div>
  <nav id="tabs">
    <button data-tab="connect">🔌 연결</button>
    <button data-tab="members">👥 구성원</button>
    <button data-tab="gallery">🖼️ 갤러리</button>
    <button data-tab="research">🔬 연구 분야</button>
    <button data-tab="news">📰 뉴스</button>
    <button data-tab="patents">📜 특허</button>
    <button data-tab="awards">🏆 상장</button>
    <button data-tab="images">🎨 교수 사진·로고</button>
    <button data-tab="files">📝 파일 직접 편집</button>
    <button data-tab="status">🚀 배포 상태</button>
  </nav>
  <div class="side-foot">
    <a id="site-link" href="../" target="_blank" rel="noopener">사이트 열기 ↗</a>
    <a id="readme-link" href="https://github.com/KNUT-SERL/KNUT-SERL.github.io#readme" target="_blank" rel="noopener">설명서(README) ↗</a>
  </div>
</aside>

<main>
  <header class="top">
    <span id="conn-badge" class="badge">연결 안 됨</span>
    <span id="repo-label"></span>
    <span class="spacer"></span>
    <span id="rate" class="hint"></span>
    <button id="reload-btn" class="btn sm" title="저장소에서 다시 읽기">↻ 다시 읽기</button>
  </header>
  <section id="view"></section>
</main>

<dialog id="modal"></dialog>
<div id="busy" hidden><div class="spin"></div><div id="busy-text">처리 중…</div></div>
<div id="toasts"></div>

<!-- 파일 형식 규칙·파서는 사이트 본체와 같은 js/content.js 를 그대로 씁니다 -->
<script src="../js/content.js?v=36"></script>
<script src="gh.js?a=1"></script>
<script src="app.js?a=1"></script>
</body>
</html>
