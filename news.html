<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News — SER Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=15">
</head>
<body>

<section class="pagehead">
  <div class="wrap">
    <h1>News</h1>
    <p>Milestones, publications, and lab life.</p>
  </div>
</section>

<section class="sec" style="padding-top:28px">
  <div class="wrap" id="news-list"></div>
</section>

<script src="data/site-data.js?v=15"></script>
<script src="js/content.js?v=15"></script>
<script src="js/common.js?v=15"></script>
<script>
"use strict";
/* 뉴스 = data/news.txt. 파일 맨 아래에 소식을 이어 붙이면 여기에는 최신순으로 표시됩니다.
   '링크:' 를 채운 소식은 제목 옆에 LINK 표시가 붙고, 내용 칸을 누르면 그 주소로 이동합니다. */
document.addEventListener("DOMContentLoaded", async () => {
  const el = document.getElementById("news-list");
  let list = [];
  try { list = await loadNews(); }
  catch (e) { el.innerHTML = `<p style="color:var(--sub)">뉴스 목록(data/news.txt)을 읽지 못했습니다.</p>`; return; }

  // 연도별로 묶어 표시 (Publications 페이지와 같은 형식, 최신 연도가 위)
  const item = n => {
    const subDate = n.date && n.date.length > 4 ? `<span class="when">${n.date}</span>` : "";
    const inner = `
        <h3>${n.title}${subDate}${n.link ? `<span class="ext">LINK ↗</span>` : ""}</h3>
        <p>${n.text || ""}</p>
        ${n.img ? `<img src="${encodeURI(n.img)}" alt="" loading="lazy" onerror="this.remove()">` : ""}`;
    return `
    <div class="news-item${n.link ? " linked" : ""}">
      ${n.link
        ? `<a class="body" href="${n.link}" target="_blank" rel="noopener">${inner}</a>`
        : `<div>${inner}</div>`}
    </div>`;
  };
  const byYear = {};
  for (const n of list) {
    const y = (String(n.date).match(/^\d{4}/) || ["기타"])[0];
    (byYear[y] ??= []).push(n);
  }
  const years = Object.keys(byYear).sort((a, b) => b.localeCompare(a));
  el.innerHTML = list.length ? years.map(y => `
    <div class="news-year"><b>${y}</b></div>
    ${byYear[y].map(item).join("")}`).join("") : `<p style="color:var(--sub)">No news yet.</p>`;
});
</script>
</body>
</html>
