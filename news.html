<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News — SER Lab</title>
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="images/favicon-192.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=27">
</head>
<body>

<section class="pagehead">
  <div class="wrap">
    <h1>News</h1>
    <p>Milestones, publications, and lab life.</p>
  </div>
</section>

<section class="sec" style="padding-top:28px">
  <div class="wrap" id="news-list"></div>
</section>

<script src="data/site-data.js?v=27"></script>
<script src="js/content.js?v=27"></script>
<script src="js/common.js?v=27"></script>
<script>
"use strict";
/* 뉴스 = data/news.txt. 파일 맨 아래에 소식을 이어 붙이면 여기에는 최신순으로 표시됩니다.
   '링크:' 를 채운 소식은 제목 옆에 LINK 표시가 붙고, 내용 칸을 누르면 그 주소로 이동합니다. */
document.addEventListener("DOMContentLoaded", async () => {
  const el = document.getElementById("news-list");
  let list = [], awards = {};
  try { list = await loadNews(); }
  catch (e) { el.innerHTML = `<p style="color:var(--sub)">뉴스 목록(data/news.txt)을 읽지 못했습니다.</p>`; return; }
  try { awards = await loadAwards(); } catch (e) { console.warn("상장 목록을 읽지 못했습니다:", e.message); }

  // 연도별로 묶어 표시 (Publications 페이지와 같은 형식, 최신 연도가 위).
  // 사진이 있으면 왼쪽에 일정한 규격의 썸네일로, 본문·사진이 있는 소식은
  // (멤버 카드처럼) 칸을 누르면 아래로 펼쳐지며 원본 사진과 전체 내용이 보입니다.
  const item = n => {
    const expandable = !!(n.body || n.img);
    // 펼쳐지는 소식에서는 LINK 표시 자체가 링크가 되고, 칸 클릭은 펼침이 됩니다
    const badge = asLink => !n.link ? "" : asLink
      ? `<a class="ext" href="${n.link}" target="_blank" rel="noopener">LINK ↗</a>`
      : `<span class="ext">LINK ↗</span>`;
    const head = asLink => `
      ${n.img ? `<img class="thumb" src="${encodeURI(n.img)}" alt="" loading="lazy" onerror="this.remove()">` : ""}
      <div>
        <h3>${n.title}${badge(asLink)}</h3>
        <p>${n.text || ""}</p>
        ${expandable ? `<div class="hint">▾ CLICK FOR DETAILS</div>` : ""}
      </div>`;
    if (!expandable) {
      // 펼칠 내용이 없으면 예전처럼: 링크가 있을 때 칸 전체가 링크
      return `
    <div class="news-item${n.link ? " linked" : ""}" id="${newsId(n)}">
      ${n.link
        ? `<a class="body" href="${n.link}" target="_blank" rel="noopener"><div class="row">${head(false)}</div></a>`
        : `<div class="row">${head(false)}</div>`}
    </div>`;
    }
    return `
    <div class="news-item hasmore" id="${newsId(n)}">
      <div class="row${n.img ? " withthumb" : ""}">${head(true)}</div>
      <div class="more">
        ${n.img ? `<img class="full" src="${encodeURI(n.img)}" alt="" loading="lazy" onerror="this.remove()">` : ""}
        ${n.body ? `<p>${n.body}</p>` : ""}
      </div>
    </div>`;
  };
  // 상장 스트립 — 연도 칸 맨 위에 같은 규격으로 가로 나열, 아래에 상장 이름
  const strip = y => (awards[y] || []).length ? `
    <div class="award-strip">${awards[y].map(a => `
      <a class="award" id="${awardId(a)}" href="${encodeURI(a.image)}" target="_blank" rel="noopener" title="${a.title}">
        <span class="img"><img src="${encodeURI(a.image)}" alt="${a.title}" loading="lazy"
             onerror="this.closest('a').remove()"></span>
        <span class="cap">${a.title}</span>
      </a>`).join("")}
    </div>` : "";

  const byYear = {};
  for (const n of list) {
    const y = (String(n.date).match(/^\d{4}/) || ["기타"])[0];
    (byYear[y] ??= []).push(n);
  }
  for (const y of Object.keys(awards)) byYear[y] ??= [];   // 상장만 있는 연도도 표시
  const years = Object.keys(byYear).sort((a, b) => b.localeCompare(a));
  el.innerHTML = years.length ? years.map(y => `
    <div class="news-year"><b>${y}</b></div>
    ${strip(y)}
    ${byYear[y].map(item).join("")}`).join("") : `<p style="color:var(--sub)">No news yet.</p>`;

  // 클릭으로 펼치고 닫기 — 한 번에 하나만 열림 (링크 클릭은 방해하지 않음)
  el.querySelectorAll(".news-item.hasmore").forEach(card => {
    card.addEventListener("click", e => {
      if (e.target.closest("a")) return;
      const wasOpen = card.classList.contains("open");
      el.querySelectorAll(".news-item.open").forEach(c => c.classList.remove("open"));
      if (!wasOpen) card.classList.add("open");
    });
  });
});
</script>
</body>
</html>
